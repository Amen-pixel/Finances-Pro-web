<!doctype html>
<html lang="fr" data-t="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Finances Pro</title>
<meta name="description" content="Gérez vos finances projet par projet : revenus, dépenses, épargne.">
<meta name="theme-color" content="#06060c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#06060c;--bg2:#180824;--pn:#10101a;--ln:#2d3350;--tx:#fff;--t2:#d2dcfa;--in:#1e2030;--tr:#262636;--sur:#000;--g:#00ff8c;--b:#00b4ff;--p:#c83cff;--o:#ff9600;--r:#ff2864;--y:#ffdc00}
:root[data-t=light]{--bg:#e9edf5;--bg2:#d4def1;--pn:#fff;--ln:#b9c3d7;--tx:#121e3c;--t2:#505c78;--in:#f0f3f9;--tr:#dee4f0;--sur:#fff;--g:#1e8c5a;--b:#195fb9;--p:#5f4b96;--o:#cd7d19;--r:#be323c;--y:#b48c0a}
*{box-sizing:border-box}
body{margin:0;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;touch-action:pan-x pan-y;-webkit-user-select:none;user-select:none;min-height:100vh;font:15px/1.4 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:linear-gradient(var(--bg),var(--bg2)) fixed;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.w{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:clamp(30px,8vw,56px);margin:8px 0;text-align:center;background:linear-gradient(90deg,var(--b),var(--p),var(--r));-webkit-background-clip:text;background-clip:text;color:transparent}
h3{margin:0 0 6px}
.sub{text-align:center;color:var(--t2);margin:0 0 14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
input,select,button{font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;min-height:42px}
input,select{width:100%}
.row input,.row select{width:auto;flex:1 1 140px}
button{cursor:pointer;font-weight:700}
.pri{background:var(--g);color:var(--sur);border-color:var(--g)}
.dg{background:var(--r);color:var(--sur);border-color:var(--r)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px;margin-bottom:14px}
.c{min-width:0;background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:14px;position:relative}
.t,.card{border-color:var(--col)}
.card{cursor:pointer}
.card .x{position:absolute;top:8px;right:8px;min-height:32px;padding:4px 10px}
.bd{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--col);color:var(--sur);font-weight:800;font-size:20px;margin-right:10px;vertical-align:middle}
.lb{font-size:12px;font-weight:700;text-transform:uppercase;color:var(--t2)}
.big{font-size:24px;font-weight:800}
.bar{height:12px;border-radius:6px;background:var(--tr);overflow:hidden;margin:6px 0}
.bar i{display:block;height:100%;background:var(--col,var(--g))}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:14px;padding-bottom:4px}.tabs button{flex:none}
.tabs button.on{background:var(--p);color:var(--sur);border-color:var(--p)}
.wt{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
.cat{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:15px;margin:6px 0}
label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.m{color:var(--t2)}
.top{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--pn);border:1px solid var(--g);padding:10px 16px;border-radius:10px;z-index:9}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.top h2{font-size:18px}
@media(max-width:480px){.cat{font-size:14px}.big{font-size:20px}.w{padding:10px}}
.new{border:3px dashed var(--g);display:grid;place-items:center;text-align:center;min-height:190px;cursor:pointer;background:rgba(0,255,140,.07)}.pl{font-size:56px;line-height:1;color:var(--g);font-weight:700}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;padding:12px;z-index:8}.md{background:var(--pn);border:2px solid var(--ln);border-radius:14px;padding:16px;width:100%;max-width:440px;max-height:90vh;overflow:auto}
@media print{body{background:#fff}.tabs,.top button,.row,.toast,button{display:none!important}}
input{-webkit-user-select:text;user-select:text}.res{color:var(--g);font-weight:700;line-height:1.5}
</style>
</head>
<body>
<div class="w" id="app"></div>
<script>
const $ = s => document.querySelector(s);
const CATS = ["Bourse / Salaire","Projet Tech / Freelance","Alimentation","Transport","Internet & Électricité","Fonds d’Urgence","Loyer","Santé","Loisirs","Éducation","Autre"];
const TYPES = {rev:["Revenu","g"], dep:["Dépense","r"], epa:["Épargne","b"]};
const COUL = ["g","b","p","o","r","y"], NCOUL = ["Vert","Bleu","Violet","Orange","Rouge","Jaune"];
const KINDS = ["Épargne","Objectif","Maison","Voiture","Études","Informatique","Voyage","Courses","Téléphone","Cadeau","Santé","Croissance"];
let D = null;
try { D = JSON.parse(localStorage.getItem("financespro")); } catch (e) {}
D = D || {theme:"dark", projets:[]};
let cur = null, tab = "tdb", flt = "", cvT = "dep", cvC = false, rpT = "dep", locked = !!D.pin, Q = "";
const save = () => { try { localStorage.setItem("financespro", JSON.stringify(D)); } catch (e) { toast("Enregistrement impossible"); } };
const fm = n => Math.round(n).toLocaleString("fr-FR") + " FCFA";
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const num = v => parseFloat(String(v).replace(/\s/g, "").replace(",", "."));
const tot = ops => { const t = {rev:0, dep:0, epa:0}; ops.forEach(o => t[o.type] += o.montant); t.reste = t.rev - t.dep - t.epa; return t; };
const bar = (v, max, col) => `<div class="bar"><i style="width:${max > 0 ? Math.min(100, Math.max(0, v / max * 100)) : 0}%;${col ? "--col:" + col : ""}"></i></div>`;
const opt = (list, sel) => list.map((x, i) => `<option value="${i}"${i === sel ? " selected" : ""}>${esc(x)}</option>`).join("");
function toast(m) { const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.append(t); setTimeout(() => t.remove(), 2400); }

function cards() {
  const q = Q.toLowerCase();
  return D.projets.filter(p => p.nom.toLowerCase().includes(q)).map(p => {
    const t = tot(p.ops), col = "var(--" + COUL[p.couleur] + ")";
    return `<div class="c card" style="--col:${col}" data-a="open" data-v="${p.id}">
      <div><span class="bd">${esc(p.nom.charAt(0).toUpperCase())}</span><b style="font-size:19px">${esc(p.nom)}</b></div>
      <div class="m">${esc(p.type)} · ${p.ops.length} opération(s)</div>
      <div class="lb" style="margin-top:10px">Reste à vivre</div><div class="big" style="color:var(--g)">${fm(t.reste)}</div>
      ${bar(t.epa, p.objectif, col)}
      <div class="m" style="font-size:13px">${p.objectif > 0 ? "Objectif : " + Math.round(Math.min(100, t.epa / p.objectif * 100)) + " % de " + p.objectif.toLocaleString("fr-FR") : "Aucun objectif défini"}</div>
      <div class="row" style="justify-content:flex-start;margin:10px 0 0"><button data-a="dup" data-v="${p.id}" style="min-height:32px;padding:4px 10px">Dupliquer</button><button class="dg" data-a="delp" data-v="${p.id}" style="min-height:32px;padding:4px 10px">Supprimer</button></div></div>`;
  }).join("") + `<div class="c new" data-a="newp"><div><div class="pl">+</div><b>Nouveau projet / épargne</b></div></div>`;
}

function vHome() {
  const all = tot(D.projets.flatMap(p => p.ops)), bt = (a, l) => `<button data-a="${a}">${l}</button>`;
  const tiles = [["Revenus cumulés", all.rev, "g"], ["Dépenses cumulées", all.dep, "r"], ["Épargne cumulée", all.epa, "b"], ["Solde global", all.reste, "p"]]
    .map(([l, v, c]) => `<div class="c t" style="--col:var(--${c})"><div class="lb">${l}</div><div class="big">${fm(v)}</div></div>`).join("");
  return `<h1>FINANCES PRO</h1>
  <p class="sub">Un dossier par projet : revenus, dépenses, épargne… tout au même endroit.</p>
  <p class="sub" style="color:var(--g);font-weight:700">Bonjour${D.nom ? ", " + esc(D.nom) : ""} ! Choisissez un projet ou créez-en un nouveau</p>
  <div class="row"><button class="pri" data-a="newp" style="padding:12px 26px">+ NOUVEAU PROJET</button><b>Rechercher :</b><input id="q" value="${esc(Q)}" placeholder="Nom du projet" style="max-width:260px"></div>
  <div class="row">${bt("print", "Rapport global")}${bt("sav", "Sauvegarde")}${bt("set", "Paramètres")}${D.pin ? bt("lock", "Verrouiller") : ""}${bt("help", "Aide")}${bt("theme", D.theme === "dark" ? "Thème clair" : "Thème sombre")}</div>
  <div class="grid" id="g">${cards()}</div><div class="grid">${tiles}</div>
  <input id="rf" type="file" accept=".json" hidden>`;
}

function modal(h) { closeM(); const o = document.createElement("div"); o.className = "ov"; o.id = "ov"; o.innerHTML = `<div class="md">${h}</div>`; document.body.append(o); const f = o.querySelector("input"); if (f) f.focus(); }
const closeM = () => { const o = $("#ov"); if (o) o.remove(); };

function vProjet(p) {
  const t = tot(p.ops), ym = today().slice(0, 7), col = "var(--" + COUL[p.couleur] + ")";
  const depM = p.ops.filter(o => o.type === "dep" && o.date.startsWith(ym)).reduce((s, o) => s + o.montant, 0);
  const tiles = [["Revenus totaux (+)", t.rev, "g"], ["Dépenses totales (−)", t.dep, "r"], ["Épargne placée", t.epa, "b"], ["Reste à vivre", t.reste, "p"]]
    .map(([l, v, c]) => `<div class="c t" style="--col:var(--${c})"><div class="lb">${l}</div><div class="big">${fm(v)}</div></div>`).join("");
  const tabs = [["tdb", "Tableau de bord"], ["his", "Historique"], ["cou", "Courbe"], ["rep", "Répartition"], ["men", "Mensuel"], ["ana", "Analyse"], ["obj", "Objectifs"], ["reg", "Réglages du projet"]]
    .map(([k, l]) => `<button data-a="tab" data-v="${k}" class="${tab === k ? "on" : ""}">${l}</button>`).join("");
  let body = "";
  if (tab === "tdb") {
    const g = {}; p.ops.filter(o => o.type === "dep").forEach(o => g[o.cat] = (g[o.cat] || 0) + o.montant);
    const rows = Object.entries(g).sort((a, b) => b[1] - a[1]), max = rows.length ? rows[0][1] : 0;
    const cats = rows.map(([c, v], i) => `<div class="cat"><span>${esc(c)}</span>${bar(v, max, "var(--" + COUL[i % 6] + ")")}<b>${fm(v)}</b></div>`).join("") || '<p class="m">Aucune dépense enregistrée.</p>';
    const taux = t.rev > 0 ? Math.round(t.epa / t.rev * 100) : 0;
    body = `<div class="grid">${tiles}</div><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))">
      <div class="c"><h3>Nouvelle opération</h3>
        <label>Description</label><input id="o-d" maxlength="80">
        <label>Montant (FCFA)</label><input id="o-m" inputmode="decimal">
        <label>Type de flux</label><select id="o-t"><option value="rev">Revenu</option><option value="dep">Dépense</option><option value="epa">Épargne</option></select>
        <label>Catégorie</label><select id="o-c">${CATS.map(c => `<option>${esc(c)}</option>`).join("")}</select>
        <label>Date</label><input id="o-dt" type="date" value="${today()}">
        <p><button class="pri" style="width:100%" data-a="addop">Ajouter l’opération</button></p></div>
      <div class="c"><h3>Dépenses par catégorie</h3>${cats}</div></div>
      <div class="grid"><div class="c"><b>Taux d’épargne : ${taux} %</b> <span class="m">(objectif recommandé : 20 % des revenus)</span>${bar(taux, 100, "var(--b)")}</div>
      <div class="c"><b>Budget dépenses du mois en cours</b>${p.budget > 0 ? bar(depM, p.budget, depM > p.budget ? "var(--r)" : "var(--g)") + `<span class="m">${fm(depM)} / ${fm(p.budget)}${depM > p.budget ? " : budget dépassé" : ""}</span>` : '<p class="m">Fixez un budget mensuel dans « Réglages du projet ».</p>'}</div></div>`;
  } else if (tab === "his") {
    const list = p.ops.filter(o => !flt || o.type === flt).sort((a, b) => b.date.localeCompare(a.date));
    const trs = list.map(o => `<tr><td>${o.date}</td><td>${esc(o.desc)}</td><td>${esc(o.cat)}</td><td style="color:var(--${TYPES[o.type][1]});font-weight:700">${TYPES[o.type][0]}</td><td style="text-align:right">${fm(o.montant)}</td><td><button class="dg" data-a="delop" data-v="${o.id}" style="min-height:32px;padding:4px 10px">Supprimer</button></td></tr>`).join("");
    body = `<div class="c"><div class="top"><h3>Historique des transactions</h3>
      <div class="row" style="margin:0"><select id="fl" data-a="flt"><option value="">Tous</option>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}"${flt === k ? " selected" : ""}>${v[0]}</option>`).join("")}</select>
      <button data-a="csv">Exporter CSV</button></div></div>
      <div class="m" style="margin-bottom:8px">${list.length} / ${p.ops.length} opération(s) affichée(s)</div>
      <div class="wt"><table><tr><th>Date</th><th>Description</th><th>Catégorie</th><th>Type</th><th style="text-align:right">Montant</th><th></th></tr>${trs}</table></div></div>`;
  } else if (tab === "cou") { body = vCou(p);
  } else if (tab === "rep") { body = vRep(p);
  } else if (tab === "men") { body = vMen(p);
  } else if (tab === "ana") { body = vAna(p);
  } else if (tab === "obj") { body = vObj(p);
  } else {
    body = `<div class="c"><h3>Réglages du projet</h3>
      <label>Nom du projet</label><input id="r-n" value="${esc(p.nom)}" maxlength="40">
      <label>Type de projet</label><select id="r-t">${opt(KINDS, Math.max(0, KINDS.indexOf(p.type)))}</select>
      <label>Couleur</label><select id="r-c">${opt(NCOUL, p.couleur)}</select>
      <label>Budget mensuel de dépenses (FCFA, 0 = aucun)</label><input id="r-b" inputmode="decimal" value="${p.budget || 0}">
      <label>Objectif d’épargne (FCFA, 0 = aucun)</label><input id="r-o" inputmode="decimal" value="${p.objectif || 0}">
      <p><button class="pri" data-a="setp">Enregistrer</button> <button class="dg" data-a="delp" data-v="${p.id}">Supprimer ce projet</button></p></div>`;
  }
  if (!tab) return `<div class="top"><button data-a="home">← Accueil</button><h2 style="margin:0;color:${col}">${esc(p.nom)}</h2><button data-a="theme">${D.theme === "dark" ? "Thème clair" : "Thème sombre"}</button></div>
    <div class="grid">${tiles}</div>
    <div class="grid">${SEC.map(([k, l, d, c]) => `<div class="c card" style="--col:var(--${c})" data-a="tab" data-v="${k}"><b style="font-size:19px">${l}</b><div class="m">${d}</div></div>`).join("")}</div>
    <p><button class="pri" data-a="print">Rapport (PDF)</button></p>`;
  const S = SEC.find(x => x[0] === tab);
  return `<div class="top"><button data-a="tab" data-v="">← ${esc(p.nom)}</button><h2 style="margin:0">${S[1]}</h2></div>${body}`;
}

function render() {
  document.documentElement.dataset.t = D.theme;
  const vw = typeof innerWidth === "number" ? innerWidth : 600, vh = typeof innerHeight === "number" ? innerHeight : 800;
  W = Math.max(300, Math.min(900, vw - 40)); H = Math.max(260, Math.min(480, Math.round(vh * .55)));
  const p = D.projets.find(x => x.id === cur);
  if (!p) cur = null;
  $("#app").innerHTML = locked ? vLock() : p ? vProjet(p) : vHome();
}
const proj = () => D.projets.find(x => x.id === cur);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
function dl(name, text, mime) { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], {type: mime})); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }

const sha = async s => [...new Uint8Array(await crypto.subtle.digest("SHA-256", new TextEncoder().encode("fp:" + s)))].map(b => b.toString(16).padStart(2, "0")).join("");
const vLock = () => `<div class="c" style="max-width:420px;margin:16vh auto;text-align:center"><h1 style="font-size:34px">FINANCES PRO</h1><h3>Espace verrouillé</h3><input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="Code PIN"><p><button class="pri" style="width:100%" data-a="unlock">Déverrouiller</button></p></div>`;
const tsel = (id, v) => `<select id="${id}" style="width:auto">${Object.entries(TYPES).map(([k, x]) => `<option value="${k}"${k === v ? " selected" : ""}>${x[0]}</option>`).join("")}</select>`;
const dot = c => `<span class="dot" style="background:var(--${c})"></span>`;
let W = 600, H = 220;

function vCou(p) {
  const L = p.ops.filter(o => o.type === cvT).sort((a, b) => a.date.localeCompare(b.date));
  let c = 0; const pts = L.map(o => [o.date, cvC ? (c += o.montant) : o.montant]);
  const n = pts.length, max = Math.max(1, ...pts.map(q => q[1])), col = "var(--" + TYPES[cvT][1] + ")";
  const xy = pts.map((q, i) => [40 + (n > 1 ? i / (n - 1) : .5) * (W - 70), H - 34 - q[1] / max * (H - 70)]);
  const svg = n ? `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto"><line x1="40" y1="${H - 34}" x2="${W - 10}" y2="${H - 34}" stroke="var(--ln)"/><polyline fill="none" stroke="${col}" stroke-width="3" points="${xy.map(q => q.join(",")).join(" ")}"/>${xy.map((q, i) => `<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="var(--pn)" stroke="${col}" stroke-width="3"/><text x="${q[0]}" y="${q[1] - 10}" text-anchor="middle" font-size="13" fill="var(--tx)">${Math.round(pts[i][1]).toLocaleString("fr-FR")}</text>`).join("")}<text x="40" y="${H - 14}" font-size="12" fill="var(--t2)">${pts[0][0]}</text><text x="${W - 10}" y="${H - 14}" font-size="12" text-anchor="end" fill="var(--t2)">${pts[n - 1][0]}</text></svg><div class="m">Total : ${fm(L.reduce((s, o) => s + o.montant, 0))} · Moyenne : ${fm(L.reduce((s, o) => s + o.montant, 0) / n)} · Opérations : ${n}</div>` : '<p class="m">Aucune opération de ce type.</p>';
  return `<div class="c"><div class="row" style="justify-content:flex-start">${tsel("cvt", cvT)}<label style="margin:0"><input type="checkbox" id="cvc" style="width:auto;min-height:0"${cvC ? " checked" : ""}> Cumulé</label></div><h3>Évolution chronologique : ${TYPES[cvT][0]}</h3>${svg}</div>`;
}

function vRep(p) {
  const g = {}; p.ops.filter(o => o.type === rpT).forEach(o => g[o.cat] = (g[o.cat] || 0) + o.montant);
  const rows = Object.entries(g).sort((a, b) => b[1] - a[1]), T = rows.reduce((s, r) => s + r[1], 0), C = 2 * Math.PI * 70; let off = 0;
  const arcs = rows.map(([k, v], i) => { const l = v / T * C, a = `<circle r="70" cx="100" cy="100" fill="none" stroke="var(--${COUL[i % 6]})" stroke-width="36" stroke-dasharray="${l} ${C - l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`; off += l; return a; }).join("");
  const leg = rows.map(([k, v], i) => `<div class="cat" style="grid-template-columns:1fr auto"><span>${dot(COUL[i % 6])}${esc(k)}</span><b>${fm(v)} (${Math.round(v / T * 100)} %)</b></div>`).join("");
  return `<div class="c"><div class="row" style="justify-content:flex-start"><b>Répartition par catégorie, type :</b>${tsel("rpt", rpT)}</div>${T ? `<div class="grid" style="align-items:center"><svg viewBox="0 0 200 200" style="width:100%;max-width:340px;margin:auto">${arcs}<text x="100" y="96" text-anchor="middle" font-size="13" fill="var(--t2)">TOTAL</text><text x="100" y="114" text-anchor="middle" font-size="20" font-weight="700" fill="var(--tx)">${Math.round(T).toLocaleString("fr-FR")}</text></svg><div>${leg}</div></div>` : '<p class="m">Aucune opération de ce type.</p>'}</div>`;
}

function vMen(p) {
  W = Math.max(W, 720);
  const n = new Date(), ms = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(n.getFullYear(), n.getMonth() - i, 1); ms.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")); }
  const S = ms.map(m => tot(p.ops.filter(o => o.date.startsWith(m)))), max = Math.max(1, ...S.flatMap(t => [t.rev, t.dep, t.epa])), bw = (W - 50) / 12;
  const bars = S.map((t, i) => ["rev", "dep", "epa"].map((k, j) => { const h = t[k] / max * (H - 70); return `<rect x="${42 + i * bw + j * bw / 3.4}" y="${H - 34 - h}" width="${bw / 3.6}" height="${h}" fill="var(--${TYPES[k][1]})"/>`; }).join("") + `<text x="${42 + i * bw + bw / 2.4}" y="${H - 18}" text-anchor="middle" font-size="11" fill="var(--t2)">${ms[i].slice(5)}/${ms[i].slice(2, 4)}</text><text x="${42 + i * bw + bw / 2.4}" y="${H - 6}" text-anchor="middle" font-size="10" fill="var(--${t.reste >= 0 ? "g" : "r"})">${t.reste ? Math.round(t.reste / 1000) + "k" : ""}</text>`).join("");
  return `<div class="c"><h3>Comparaison mensuelle (12 derniers mois)</h3><div class="m">${dot("g")}Revenus ${dot("r")}Dépenses ${dot("b")}Épargne · sous chaque mois : net = revenus − dépenses − épargne</div><div class="wt"><svg viewBox="0 0 ${W} ${H}" style="width:${W}px;max-width:none;height:auto"><line x1="40" y1="${H - 34}" x2="${W - 8}" y2="${H - 34}" stroke="var(--ln)"/>${bars}</svg></div></div>`;
}

function vAna(p) {
  const t = tot(p.ops), now = new Date(), ym = today().slice(0, 7), dim = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
  const deps = p.ops.filter(o => o.type === "dep"), dm = deps.filter(o => o.date.startsWith(ym)).reduce((s, o) => s + o.montant, 0);
  const moy = dm / now.getDate(), prev = moy * dim, taux = t.rev > 0 ? t.epa / t.rev * 100 : 0, g = {}, mo = {};
  deps.forEach(o => { g[o.cat] = (g[o.cat] || 0) + o.montant; const m = o.date.slice(0, 7); mo[m] = (mo[m] || 0) + o.montant; });
  const top = Object.entries(g).sort((a, b) => b[1] - a[1])[0], big = deps.slice().sort((a, b) => b.montant - a.montant)[0], mm = Object.entries(mo).sort((a, b) => b[1] - a[1])[0];
  const score = Math.round(Math.min(100, 40 + Math.min(taux, 20) * 1.5 + (t.reste >= 0 ? 20 : 0) + (p.budget > 0 ? (dm <= p.budget ? 10 : 0) : 5)));
  const T = [["Score de santé", score + " / 100", "g"], ["Dépense moyenne / jour", fm(moy), "o"], ["Prévision dépenses fin de mois", fm(prev), "b"], ["Plus grosse dépense", big ? fm(big.montant) + " · " + big.desc : "–", "r"], ["Catégorie dominante", top ? top[0] + " (" + Math.round(top[1] / t.dep * 100) + " %)" : "–", "p"], ["Mois le plus dépensier", mm ? mm[0] + " · " + fm(mm[1]) : "–", "y"]];
  const tips = [];
  if (t.rev > 0 && taux < 20) tips.push(`Votre taux d’épargne est de ${Math.round(taux)} % : visez au moins 10 à 20 % de vos revenus.`);
  if (top && top[1] / t.dep > .5) tips.push(`La catégorie « ${esc(top[0])} » pèse ${Math.round(top[1] / t.dep * 100)} % de vos dépenses.`);
  if (p.budget > 0 && prev > p.budget) tips.push(`À ce rythme, vous dépasserez votre budget mensuel (prévision : ${fm(prev)}).`);
  if (!tips.length) tips.push("Continuez ainsi, vos finances sont équilibrées.");
  return `<div class="c"><h3>Analyse intelligente du projet</h3><div class="grid">${T.map(([l, v, c]) => `<div class="c t" style="--col:var(--${c})"><div class="lb">${l}</div><div class="big" style="font-size:17px;white-space:normal">${esc(v)}</div></div>`).join("")}</div><h3 style="color:var(--y)">Conseils automatiques</h3>${tips.map(x => `<p>• ${x}</p>`).join("")}</div>`;
}

const SEC = [["tdb", "Tableau de bord", "Saisir une opération, dépenses par catégorie", "g"], ["his", "Historique", "Toutes les opérations, filtre et export CSV", "b"], ["cou", "Courbe", "Évolution dans le temps", "p"], ["rep", "Répartition", "Diagramme par catégorie", "o"], ["men", "Mensuel", "Comparaison des 12 derniers mois", "y"], ["ana", "Analyse", "Score, prévisions et conseils", "r"], ["obj", "Objectifs", "Calculer la durée ou le montant à cotiser", "g"], ["reg", "Réglages du projet", "Nom, type, couleur, budget, objectif", "p"]];
const UP = ["jour", "semaine", "mois", "an"], UD = ["jours", "semaines", "mois", "ans"], UJ = [1, 7, 30.4375, 365.25];
const so = (id, L, d) => `<select id="${id}">${L.map((x, i) => `<option value="${i}"${i === d ? " selected" : ""}>${x}</option>`).join("")}</select>`;
const calc = k => `<label>Je peux cotiser (FCFA)</label><input id="${k}-m" inputmode="decimal" placeholder="Ex. : 2000">
  <label>par</label>${so(k + "-u", UP, 0)}
  <p><button class="pri" style="width:100%" data-a="cA" data-v="${k}">Calculer la durée</button></p><p class="res" id="${k}-r1"></p>
  <label>Ou : je veux y arriver en</label><div class="row" style="margin:0"><input id="${k}-d" inputmode="numeric" placeholder="Ex. : 12" style="flex:1 1 90px">${so(k + "-v", UD, 2)}</div>
  <p><button style="width:100%;background:var(--b);color:var(--sur)" data-a="cB" data-v="${k}">Calculer ce qu’il faut cotiser</button></p><p class="res" id="${k}-r2" style="color:var(--b)"></p>`;
function vObj(p) {
  const t = tot(p.ops), o = p.objectif || 0;
  return `<div class="c"><h3 style="color:var(--b)">Objectif du projet</h3>${bar(t.epa, o, "var(--p)")}<div class="m">${o > 0 ? Math.round(Math.min(100, t.epa / o * 100)) + " % de l’objectif (" + fm(t.epa) + " / " + fm(o) + ")" : "Aucun objectif : définissez-le dans « Réglages du projet »."}</div>${o > t.epa ? `<p>Reste à épargner : <b>${fm(o - t.epa)}</b></p>` : ""}${calc("a")}</div>
  <div class="c" style="margin-top:14px"><h3 style="color:var(--y)">Estimer un achat ou un projet libre</h3><p class="m">Indépendant de l’objectif du projet : entrez simplement le prix.</p>
  <label>Prix de ce que vous voulez payer (FCFA)</label><input id="b-p" inputmode="decimal" placeholder="Ex. : 500 000">${calc("b")}</div>`;
}
const tg = k => { const p = proj(); return k === "a" ? Math.max(0, (p.objectif || 0) - tot(p.ops).epa) : (num($("#b-p").value) || 0); };
const dur = d => { if (d < 60) return Math.ceil(d) + " jour(s)"; const m = Math.round(d / 30.4375), y = Math.floor(m / 12), r = m % 12; return y < 2 ? m + " mois" : y + " ans" + (r ? " et " + r + " mois" : ""); };
const cible = (k, r) => { const T = tg(k); if (T > 0) return T; r.textContent = k === "a" ? (proj().objectif > 0 ? "Objectif déjà atteint !" : "Définissez d’abord un objectif dans « Réglages du projet ».") : "Entrez d’abord le prix à payer."; return 0; };

const A = {
  unlock: async () => { if (await sha($("#pin").value) === D.pin) { locked = false; render(); } else toast("Code incorrect"); },
  pin: async () => {
    const v = prompt(D.pin ? "Nouveau code PIN (laisser vide pour supprimer le code) :" : "Choisissez un code PIN (4 caractères minimum) :");
    if (v === null) return;
    if (v === "") { delete D.pin; closeM(); save(); render(); return toast("Code PIN supprimé"); }
    if (v.length < 4) return toast("4 caractères minimum");
    D.pin = await sha(v); closeM(); save(); render(); toast("Code PIN enregistré");
  },
  lock: () => { locked = true; render(); },
  print: () => { const t = D.theme; document.documentElement.dataset.t = "light"; window.print(); document.documentElement.dataset.t = t; },
  cA: k => {
    const r = $("#" + k + "-r1"), T = cible(k, r); if (!T) return;
    const m = num($("#" + k + "-m").value), u = +$("#" + k + "-u").value;
    if (!(m > 0)) { r.textContent = "Entrez le montant que vous pouvez cotiser."; return; }
    const n = Math.ceil(T / m), d = n * UJ[u], dt = new Date(Date.now() + d * 864e5).toLocaleDateString("fr-FR", {day: "numeric", month: "long", year: "numeric"});
    r.textContent = "En cotisant " + fm(m) + " par " + UP[u] + ", il faudra " + n + " " + (UP[u] === "mois" ? "mois" : UP[u] + (n > 1 ? "s" : "")) + " (environ " + dur(d) + "). Date estimée : " + dt + ".";
  },
  cB: k => {
    const r = $("#" + k + "-r2"), T = cible(k, r); if (!T) return;
    const n = num($("#" + k + "-d").value), v = +$("#" + k + "-v").value, d = n * UJ[v];
    if (!(d >= 1)) { r.textContent = "Entrez une durée valide."; return; }
    r.textContent = "Pour atteindre " + fm(T) + " en " + n + " " + (n === 1 ? UP[v] : UD[v]) + " : " + UP.map((l, i) => [l, UJ[i]]).filter(x => d >= x[1]).map(x => fm(Math.ceil(T / d * x[1])) + " par " + x[0]).join(" · ") + ".";
  },
  open: v => { cur = v; tab = ""; flt = ""; render(); scrollTo(0, 0); },
  home: () => { cur = null; render(); },
  tab: v => { tab = v; render(); scrollTo(0, 0); },
  theme: () => { D.theme = D.theme === "dark" ? "light" : "dark"; save(); render(); },
  flt: () => { flt = $("#fl").value; render(); },
  newp: () => modal(`<h3>Nouveau projet</h3>
    <label>Nom du projet</label><input id="np-n" maxlength="40" placeholder="Ex. : Achat d’un ordinateur">
    <label>Type de projet</label><select id="np-t">${opt(KINDS, 0)}</select>
    <label>Couleur</label><select id="np-c">${opt(NCOUL, 0)}</select>
    <label>Budget mensuel de dépenses (FCFA, facultatif)</label><input id="np-b" inputmode="decimal" placeholder="0">
    <label>Objectif d’épargne (FCFA, facultatif)</label><input id="np-o" inputmode="decimal" placeholder="0">
    <p><button class="pri" data-a="newp2">Créer le projet</button> <button data-a="cm">Annuler</button></p>`),
  newp2: () => {
    const nom = $("#np-n").value.trim();
    if (!nom) return toast("Donnez un nom à votre projet");
    D.projets.push({id: uid(), nom, type: KINDS[$("#np-t").value], couleur: +$("#np-c").value, budget: Math.max(0, num($("#np-b").value) || 0), objectif: Math.max(0, num($("#np-o").value) || 0), ops: []});
    closeM(); save(); render();
  },
  cm: () => closeM(),
  dup: v => {
    const c = JSON.parse(JSON.stringify(D.projets.find(x => x.id === v)));
    c.id = uid(); c.nom += " (copie)"; c.ops.forEach(o => o.id = uid());
    D.projets.push(c); save(); render(); toast("Projet dupliqué");
  },
  set: () => modal(`<h3>Paramètres généraux</h3><label>Votre prénom (affiché sur l’accueil)</label><input id="s-n" maxlength="30" value="${esc(D.nom || "")}">
    <p><button class="pri" data-a="setn">Enregistrer</button></p><h3 style="margin-top:16px">Code PIN</h3>
    <p class="m">${D.pin ? "Un code PIN est actif." : "Aucun code PIN défini."}</p>
    <p><button data-a="pin">${D.pin ? "Changer ou supprimer le code PIN" : "Définir un code PIN"}</button> <button data-a="cm">Fermer</button></p>`),
  setn: () => { D.nom = $("#s-n").value.trim(); save(); closeM(); render(); },
  sav: () => modal(`<h3>Sauvegarde et restauration</h3><p class="m">Vos données sont enregistrées sur cet appareil. Une sauvegarde est un fichier que vous pouvez conserver ailleurs.</p>
    <p><button class="pri" data-a="bak">Créer une sauvegarde</button></p><p><button data-a="rst">Restaurer une sauvegarde</button></p><p><button data-a="cm">Fermer</button></p>`),
  help: () => modal(`<h3>Aide</h3><p>• Créez un projet par objectif : achat, voyage, budget familial…</p>
    <p>• Dans un projet, ajoutez vos revenus, dépenses et épargne, puis consultez les onglets Courbe, Répartition, Mensuel, Analyse et Objectifs.</p>
    <p>• Vos données restent sur cet appareil : utilisez « Sauvegarde » régulièrement.</p>
    <p>• Pour installer l’application : menu du navigateur, puis « Installer l’application » ou « Ajouter à l’écran d’accueil ».</p>
    <p class="m">Règle 50/30/20 : 50 % besoins, 30 % envies, 20 % épargne.</p><p><button data-a="cm">Fermer</button></p>`),
  delp: v => {
    const p = D.projets.find(x => x.id === v);
    if (p && confirm("Supprimer le projet « " + p.nom + " » et toutes ses opérations ?")) { D.projets = D.projets.filter(x => x.id !== v); cur = null; save(); render(); }
  },
  addop: () => {
    const p = proj(), d = $("#o-d").value.trim(), m = num($("#o-m").value), dt = $("#o-dt").value;
    if (!d) return toast("Description obligatoire");
    if (!(m > 0)) return toast("Montant invalide");
    if (!dt) return toast("Date obligatoire");
    p.ops.push({id: uid(), date: dt, desc: d, cat: $("#o-c").value, type: $("#o-t").value, montant: m});
    save(); render(); toast("Opération ajoutée");
  },
  delop: v => { const p = proj(); if (confirm("Supprimer cette opération ?")) { p.ops = p.ops.filter(o => o.id !== v); save(); render(); } },
  setp: () => {
    const p = proj(), n = $("#r-n").value.trim();
    if (!n) return toast("Le nom ne peut pas être vide");
    p.nom = n; p.type = KINDS[$("#r-t").value]; p.couleur = +$("#r-c").value; p.budget = Math.max(0, num($("#r-b").value) || 0); p.objectif = Math.max(0, num($("#r-o").value) || 0);
    save(); render(); toast("Réglages enregistrés");
  },
  csv: () => {
    const p = proj(), q = s => '"' + String(s).replace(/"/g, '""') + '"';
    const rows = p.ops.map(o => [o.date, q(o.desc), q(o.cat), TYPES[o.type][0], o.montant].join(";"));
    dl(p.nom.replace(/[^\w-]+/g, "_") + ".csv", "\uFEFFDate;Description;Catégorie;Type;Montant\n" + rows.join("\n"), "text/csv;charset=utf-8");
  },
  bak: () => dl("finances-pro-sauvegarde-" + today() + ".json", JSON.stringify(D), "application/json"),
  rst: () => $("#rf").click()
};
document.addEventListener("click", e => { if (e.target.id === "ov") return closeM(); const a = e.target.closest("[data-a]"); if (a && a.tagName !== "SELECT" && A[a.dataset.a]) A[a.dataset.a](a.dataset.v); });
document.addEventListener("change", e => {
  if (e.target.id === "fl") A.flt();
  if (e.target.id === "cvt") { cvT = e.target.value; render(); }
  if (e.target.id === "cvc") { cvC = e.target.checked; render(); }
  if (e.target.id === "rpt") { rpT = e.target.value; render(); }
  if (e.target.id === "rf" && e.target.files[0]) {
    const r = new FileReader();
    r.onload = () => {
      try {
        const j = JSON.parse(r.result);
        if (!Array.isArray(j.projets)) throw 0;
        if (confirm("Remplacer toutes vos données actuelles par cette sauvegarde ?")) { D = j; cur = null; save(); render(); toast("Sauvegarde restaurée"); }
      } catch (x) { toast("Fichier de sauvegarde invalide"); }
    };
    r.readAsText(e.target.files[0]);
  }
});
document.addEventListener("keydown", e => { if (e.key === "Enter" && e.target.id === "pin") A.unlock(); if (e.key === "Enter" && e.target.id === "np-n") A.newp2(); });
document.addEventListener("input", e => { if (e.target.id === "q") { Q = e.target.value; $("#g").innerHTML = cards(); } });
document.addEventListener("gesturestart", e => e.preventDefault());
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
